# Shared release workflow: build the distributions and publish them to PyPI
# with trusted publishing, so no API token is ever stored.
#
#   jobs:
#     publish:
#       uses: campbio/py-dev-standards/.github/workflows/release.yaml@v1
#       permissions:
#         contents: read
#         id-token: write
#
# The package must first be registered as a trusted publisher on PyPI (see
# ADOPTING.md), naming this repository, the workflow file, and the environment.

# Action versions are the newest floating major tag each action publishes, so
# patch and minor fixes arrive without a change here. astral-sh/setup-uv stops
# publishing major tags after v7 even though it has released further, so v7 is
# deliberate rather than stale; it already runs on Node 24.
name: Release

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"
      environment:
        description: GitHub environment that holds the PyPI trusted publisher.
        type: string
        default: pypi
      repository-url:
        description: Set to the TestPyPI URL for a rehearsal.
        type: string
        default: https://upload.pypi.org/legacy/

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ inputs.python-version }}
      # check-full runs the full gate and builds dist/ as its last step, so
      # nothing is published that has not just passed every check.
      - run: make check-full
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.repository-url }}
